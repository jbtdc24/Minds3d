# 💾 Free daily database backup (Supabase Free plan has none).
# Dumps the whole database, encrypts it with BACKUP_PASSWORD, keeps it as a download for 30 days (Actions → db-backup → a run → Artifacts).
# Secrets (GitHub → repo → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  = Supabase → Connect → "Session pooler" connection string (with the database password filled in)
#   BACKUP_PASSWORD  = any long password; keep it safe, it is needed to open a backup
# Open a backup:  gpg -d backup.sql.gz.gpg | gunzip > backup.sql
name: db-backup
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: postgres:17
    steps:
      - name: Dump and encrypt
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PW: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -eu
          [ -n "$DB" ] && [ -n "$PW" ] || { echo "Missing SUPABASE_DB_URL or BACKUP_PASSWORD secret"; exit 1; }
          apt-get update -qq && apt-get install -y -qq gnupg >/dev/null
          pg_dump "$DB" --no-owner --no-privileges --schema=public | gzip > backup.sql.gz
          echo "$PW" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 -c -o backup.sql.gz.gpg backup.sql.gz
          rm backup.sql.gz
          ls -lh backup.sql.gz.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 30
