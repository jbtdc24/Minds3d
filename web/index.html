<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Arena 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --lime: #d4ff1f; --ink: #0b0d08; --panel: rgba(10, 12, 8, .72); --text: #f2f2ea; --muted: #9aa08c; --red: #ff4d4d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: 'JetBrains Mono', monospace; }
  #stage { position: fixed; inset: 0; background: linear-gradient(90deg, var(--bgA, #2a3a2a), var(--bgB, #3a2a3a)); transition: background .6s; }
  #stage::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0,0,0,.55)); pointer-events: none; }
  canvas { display: block; position: relative; z-index: 1; }
  .hud { position: fixed; top: 12px; left: 16px; right: 16px; z-index: 5; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .card { background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 8px; display: flex; gap: 10px; align-items: center; width: min(46%, 340px); backdrop-filter: blur(6px); }
  .card.right { flex-direction: row-reverse; text-align: right; }
  .card img { width: 56px; height: 56px; border-radius: 6px; image-rendering: pixelated; flex: none; }
  .card .meta { flex: 1; min-width: 0; }
  .card .name { font-family: 'Anton', sans-serif; font-size: 20px; letter-spacing: .04em; line-height: 1; }
  .card .rar { font-size: 10px; color: var(--muted); letter-spacing: .12em; margin: 3px 0 6px; }
  .bar { height: 10px; background: rgba(255,255,255,.1); border-radius: 5px; overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0; background: var(--lime); transform-origin: left; transition: transform .25s; }
  .card.right .bar i { transform-origin: right; }
  .bar b { position: absolute; inset: 0; background: #fff; transform-origin: left; transition: transform .9s .25s; opacity: .35; }
  .card.right .bar b { transform-origin: right; }
  .hp { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .controls { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 8px; align-items: center; background: var(--panel); padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(6px); flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
  .controls label { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .controls input { width: 70px; background: #000; color: var(--text); border: 1px solid #333; border-radius: 6px; padding: 7px; font: inherit; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; background: #222; color: var(--text); }
  button.go { background: var(--lime); color: #000; letter-spacing: .1em; }
  button:disabled { opacity: .4; cursor: default; }
  #banner { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; pointer-events: none; font-family: 'Anton', sans-serif; font-size: clamp(56px, 14vw, 160px); color: var(--lime); text-shadow: 0 0 30px rgba(212,255,31,.6), 0 6px 0 #000; opacity: 0; transform: scale(1.6); transition: opacity .15s, transform .25s; letter-spacing: .04em; text-align: center; line-height: .95; }
  #banner.on { opacity: 1; transform: scale(1); }
  #pops { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
  .pop { position: absolute; font-family: 'Anton', sans-serif; font-size: 34px; color: #fff; text-shadow: 0 3px 0 #000, 0 0 12px rgba(0,0,0,.6); transform: translate(-50%, -50%); animation: pop 1s ease-out forwards; white-space: nowrap; }
  .pop.crit { color: var(--lime); font-size: 52px; }
  @keyframes pop { 0% { transform: translate(-50%, -20%) scale(.4); opacity: 0; } 15% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -160%) scale(1); opacity: 0; } }
  #flash { position: fixed; inset: 0; z-index: 3; background: #fff; opacity: 0; pointer-events: none; }
  #log { position: fixed; bottom: 74px; left: 0; right: 0; text-align: center; z-index: 5; font-size: 12px; color: var(--muted); pointer-events: none; padding: 0 16px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: var(--ink); font-family: 'Anton', sans-serif; font-size: 28px; letter-spacing: .1em; }
  @media (max-width: 600px) { .card img { width: 40px; height: 40px; } .card .name { font-size: 16px; } .controls input { width: 58px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="flash"></div>
<div id="pops"></div>
<div class="hud">
  <div class="card" id="cardA"><img alt=""><div class="meta"><div class="name"></div><div class="rar"></div><div class="bar"><b></b><i></i></div><div class="hp"></div></div></div>
  <div class="card right" id="cardB"><img alt=""><div class="meta"><div class="name"></div><div class="rar"></div><div class="bar"><b></b><i></i></div><div class="hp"></div></div></div>
</div>
<div id="banner"></div>
<div id="log"></div>
<div class="controls">
  <label>YOU <input id="idA" type="number" min="1" max="3333"></label>
  <button id="rndA" title="Random">🎲</button>
  <button class="go" id="fight">FIGHT</button>
  <button id="rndB" title="Random">🎲</button>
  <label><input id="idB" type="number" min="1" max="3333"> FOE</label>
</div>
<div id="loading">LOADING ARENA…</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
